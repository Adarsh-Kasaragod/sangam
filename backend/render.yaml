services:
  - type: web
    name: sangam-backend
    env: php
    plan: starter
    buildCommand: "composer install --no-dev || echo 'no composer'"
    startCommand: "php -S 0.0.0.0:$PORT -t ."
    envVars:
      - key: DB_HOST
        fromService: sangam-db
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "event_app"
      - key: DB_USER
        value: "root"
      - key: DB_PASS
        fromSecret: db_password
      - key: ALLOWED_ORIGIN
        value: "https://sangam-frontend.onrender.com"
      - key: APP_SECRET
        fromSecret: app_secret
